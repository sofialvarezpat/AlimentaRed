spring.application.name=AlimentaRed

# Conexión PostgreSQL
# Por defecto usa PostgreSQL local. Para Supabase, define las variables de entorno DB_URL, DB_USER y DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alimentared}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:AlimentaRed2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:alimentared-clave-secreta-de-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiration-ms=86400000